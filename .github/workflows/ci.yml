name: CI

# 回归门禁：每次 push 到 master + 所有 PR 自动跑全部隔离 probe + QA 主套件。
# 清单在 TestReport/run_ci_suite.py 单处维护（不在此 yaml 重复）。
# runner 用 windows-latest：与开发环境(Win11)一致，零跨平台风险。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    # ⚠️ S5 全仓零 sqlite 后，门禁探针全量依赖 PostgreSQL——本 workflow 尚未挂 PG service，
    #    在补上前 CI 无法跑绿（本地对着 PG 容器已 39/39）。GitHub services 容器仅 Linux runner
    #    支持，收口需将 runner 从 windows-latest 切到 ubuntu 并加 postgres:16 service + 迁移步骤，
    #    或在 Windows runner 上装 PG。属 S5 Phase 3 割接项，见 TestReport/README.md「GitHub Actions 待收口」。
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Run regression gate (39 probes + QA suite; requires PostgreSQL — see note above)
        run: python TestReport/run_ci_suite.py
