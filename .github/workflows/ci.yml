name: CI

# 回归门禁：每次 push 到 master + 所有 PR 自动跑全部隔离 probe + QA 主套件。
# 清单在 TestReport/run_ci_suite.py 单处维护（不在此 yaml 重复）。
# runner 用 windows-latest：与开发环境(Win11)一致，零跨平台风险。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Run regression gate (40 probes + QA suite)
        run: python TestReport/run_ci_suite.py
